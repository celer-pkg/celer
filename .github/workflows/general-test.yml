# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: general-test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27.4'

    - name: Build Celer
      run: go build -v ./...

    - name: Test
      run: |
        go test -artifacts -outputdir="${{ runner.temp }}" -v ./depcheck/... -timeout 1h
        go test -artifacts -outputdir="${{ runner.temp }}" -v ./configs/...  -timeout 1h
        go test -artifacts -outputdir="${{ runner.temp }}" -v ./pkgs/git/... -timeout 1h

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: ${{ runner.temp }}/_artifacts
        if-no-files-found: ignore
