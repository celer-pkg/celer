syntax = "proto3";

package tst.i2;

message StreamMessage {
  bytes data = 1;
  uint64 tag = 2;
}

service Interceptor {
  rpc BidiStream(stream StreamMessage) returns (stream StreamMessage);
  rpc ClientStream(stream StreamMessage) returns (StreamMessage);
}
