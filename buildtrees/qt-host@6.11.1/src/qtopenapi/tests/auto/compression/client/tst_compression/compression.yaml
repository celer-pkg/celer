openapi: 3.1.1
servers:
  - url: 'http://127.0.0.1:20203/v2'
info:
  title: Compression Test
  description: >
    This specification is needed to check how the compression is implemented.
  version: 1.0.0
tags:
  - name: test
    description: test operations

paths:
  /compression/roundtrip:
    post:
      tags: [test]
      operationId: roundtrip
      summary: "send the file and receive it back with various compression parameters"
      requestBody:
        content:
          application/pdf:
            schema:
              type: string
              format: binary
        required: true
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
