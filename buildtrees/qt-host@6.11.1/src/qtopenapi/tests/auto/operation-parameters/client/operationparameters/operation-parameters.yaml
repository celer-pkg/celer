openapi: 3.1.1
servers:
  - url: 'http://127.0.0.1:10203/v2'
info:
  title: Operation Parameters Test
  description: >
    This specification is intended for testing purposes. It demonstrates a wide range
    of combinations of the `style` and `explode` attributes for parameters in various
    locations: query, path, header, and cookie. The goal is to verify correct path
    and parameter generation for each case.
  version: 1.0.0
tags:
  - name: test
    description: test operations

paths:
  /path/string/simple-explode/{stringParameter}:
    get:
      tags: [test]
      operationId: simpleExplodeString
      summary: Simple style with explode set to true for string path parameter.
      parameters:
        - name: stringParameter
          in: path
          required: true
          style: simple
          explode: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
