openapi: 3.1.1
servers:
  - url: 'http://127.0.0.1:10205/v2'
info:
  title: The client2 specification
  description: >
    This specification is intended for testing purposes.
  version: 1.0.0
tags:
  - name: client2Test
    description: Test client2. It will be generated with 'Gen-Client-Lib' option.

paths:
  /path/int/simple-explode/{intParameter}:
    get:
      tags: [client2Test]
      operationId: simpleExplodeInt
      summary: Simple style with explode set to true for integer path parameter.
      parameters:
        - name: intParameter
          in: path
          required: true
          style: simple
          explode: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
