[toolchain]
  url = "https://github.com/celer-pkg/celer-conf/releases/download/resource/gcc-ubuntu-7.5.0-x86_64-aarch64-linux-gnu.tar.xz"
  sha256 = "sha256:69dbb395d3156863c9151f0d7629ddad4f4652d1ca54942cf968e4d058de5f03"
  path = "gcc-ubuntu-7.5.0-x86_64-aarch64-linux-gnu/bin"
  name = "gcc"
  version = "7.5.0"
  system_name = "linux"
  system_processor = "aarch64"
  host = "aarch64-linux-gnu"
  crosstool_prefix = "aarch64-linux-gnu-"
  cc = "aarch64-linux-gnu-gcc"
  cxx = "aarch64-linux-gnu-g++"
  fc = "aarch64-linux-gnu-gfortran"
  ld = "aarch64-linux-gnu-ld"
  ranlib = "aarch64-linux-gnu-gcc-ranlib"
  ar = "aarch64-linux-gnu-gcc-ar"
  nm = "aarch64-linux-gnu-nm"
  objdump = "aarch64-linux-gnu-objdump"
  strip = "aarch64-linux-gnu-strip"
  objcopy = "aarch64-linux-gnu-objcopy"
  cflags = [
    "-Wall",
    "-Wno-unused-variable",
    "-Wno-deprecated",
  ]
  cxxflags = [
    "-Wall",
    "-Wno-unused-variable",
    "-Wno-deprecated",
  ]

[rootfs]
  url = "https://github.com/celer-pkg/celer-conf/releases/download/resource/ubuntu-base-18.04.5-base-arm64.tar.xz"
